name: WAKFU localization update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only inspect the Ankama source; do not create a branch or PR
        required: false
        default: true
        type: boolean
      test_fixture:
        description: Run the isolated simulated update and create a TEST ONLY PR
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: wakfu-localization-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Validate automation modules
        run: python -m unittest discover -s automation/tests -p 'test_*.py' -v
      - name: Inspect Ankama localization without writing project state
        run: |
          python -m automation.update_wakfu_localization --dry-run | tee "$RUNNER_TEMP/wakfu-diff.json"
          python - "$RUNNER_TEMP/wakfu-diff.json" <<'PY'
          import json
          import sys

          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          changed = report.get("diff", {})
          if not any(changed.get(kind) for kind in ("NEW", "MODIFIED", "REMOVED")):
              print("NO_CHANGES")
          else:
              print("DIFF_ONLY")
          PY

  # This is an explicitly opt-in, fixture-only write path.  It never consumes
  # production diff output and it can only commit the disposable fixture
  # directory below.  The future production path must keep the same guard:
  # empty NEW/MODIFIED/REMOVED means NO_CHANGES and no branch/commit/PR.
  create-test-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.test_fixture == true && needs.inspect-upstream.result == 'success'
    needs: inspect-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TEST_BRANCH: codex/test-wakfu-update-pipeline-20260905
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_DEVICE_COUNT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Create isolated translation runtime
        run: python -m venv "$RUNNER_TEMP/argos-venv"
      - name: Install exact translation runtime
        run: "$RUNNER_TEMP/argos-venv/bin/python -m pip install --disable-pip-version-check -r requirements-translation.txt"
      - name: Download and verify the locked Argos model
        run: |
          "$RUNNER_TEMP/argos-venv/bin/python" - "$RUNNER_TEMP/translate-en_tr-1_5.argosmodel" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request
          from pathlib import Path

          lock = json.loads(Path("automation/model-lock.json").read_text(encoding="utf-8"))
          target = Path(sys.argv[1])
          request = urllib.request.Request(
              lock["url"],
              headers={"User-Agent": "WakfuTurkceCeviri/test-pr-pipeline"},
          )
          with urllib.request.urlopen(request, timeout=180) as response, target.open("wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          if target.stat().st_size != lock["size_bytes"] or digest.lower() != lock["sha256"].lower():
              raise SystemExit("ARGOS_MODEL_VERIFICATION_FAILED")
          print(f"ARGOS_MODEL_OK|{target.stat().st_size}|{digest}")
          PY
      - name: Run simulated update without touching production state
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/argos-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/argos-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/argos-cache"
          "$RUNNER_TEMP/argos-venv/bin/python" -m automation.simulated_pr_update \
            --output-dir "$RUNNER_TEMP/pr_pipeline_output" \
            --model-path "$RUNNER_TEMP/translate-en_tr-1_5.argosmodel" \
            --model-lock automation/model-lock.json
      - name: Commit only the test fixture
        id: commit
        run: |
          if git ls-remote --exit-code --heads origin "$TEST_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TEST_BRANCH"
            git switch --track --create "$TEST_BRANCH" "origin/$TEST_BRANCH"
          else
            git switch --create "$TEST_BRANCH"
          fi
          rm -rf automation/fixtures/pr_pipeline
          cp -R "$RUNNER_TEMP/pr_pipeline_output" automation/fixtures/pr_pipeline
          git add automation/fixtures/pr_pipeline
          if git diff --cached --quiet; then
            echo "TEST_FIXTURE_ALREADY_ON_BRANCH"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Test simulated WAKFU translation PR pipeline"
            git push --set-upstream origin "$TEST_BRANCH"
          fi
          changed_files=$(git diff --name-only main...HEAD)
          forbidden_files=$(printf '%s\n' "$changed_files" | grep -Ev '^automation/fixtures/pr_pipeline/' || true)
          if [ -n "$forbidden_files" ]; then
            echo "TEST_PR_SCOPE_VIOLATION"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
          if [ -z "$changed_files" ]; then
            echo "TEST_FIXTURE_PRODUCED_NO_CHANGES"
            exit 1
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed_files" > "$RUNNER_TEMP/test-pr-changed-files.txt"
      - name: Create TEST ONLY pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/argos-venv/bin/python" - "automation/fixtures/pr_pipeline/simulated_update_report.json" "$RUNNER_TEMP/test-pr-body.md" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          diff = report["diff"]
          counts = report["translation_counts"]
          run_url = f"https://github.com/{sys.argv[3]}/actions/runs/{sys.argv[4]}"
          body = f"""## TEST PIPELINE ONLY

          **DO NOT MERGE** — this PR is a disposable simulated update used to verify the write/PR path.

          - Simulated game version: `{report['simulated_game_version']}`
          - Simulated patch version: `{report['simulated_patch_version']}`
          - NEW: `{diff['NEW']}`
          - MODIFIED: `{diff['MODIFIED']}`
          - REMOVED: `{diff['REMOVED']}`
          - UNCHANGED: `{diff['UNCHANGED']}`
          - Translation Memory: `{counts['tm']}`
          - Glossary: `{counts['glossary']}`
          - Argos: `{counts['argos']}`
          - Manual duplicate-key resolutions: `{counts['manual']}`
          - Placeholder/tag validation: `{report['placeholder_and_tag_validation']}`
          - Full validation: `{report['validation']}`
          - JAR build: `{report['build']['status']}` (temporary asset, not a Release)
          - Production state/translation files changed: `no`
          - Workflow run: {run_url}

          This PR must remain unmerged. No Release is created by this workflow.
          """
          Path(sys.argv[2]).write_text(body, encoding="utf-8")
          PY
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$TEST_BRANCH" \
            --title "[TEST] Simulated WAKFU translation update pipeline" \
            --body-file "$RUNNER_TEMP/test-pr-body.md")
          auto_merge_disabled=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest == null')
          if [ "$auto_merge_disabled" != "true" ]; then
            echo "AUTO_MERGE_MUST_REMAIN_DISABLED"
            exit 1
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### TEST PIPELINE ONLY"
            echo "- Branch: `$TEST_BRANCH`"
            echo "- Commit: `${{ steps.commit.outputs.commit_sha }}`"
            echo "- PR: $pr_url"
            echo "- Auto-merge: disabled"
            echo "- Changed files:"
            sed 's/^/  - /' "$RUNNER_TEMP/test-pr-changed-files.txt"
          } >> "$GITHUB_STEP_SUMMARY"
