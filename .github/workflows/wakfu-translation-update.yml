name: WAKFU localization update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only inspect the Ankama source; do not create a branch or PR
        required: false
        default: true
        type: boolean
      test_fixture:
        description: Run the isolated simulated update and create a TEST ONLY PR
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: wakfu-localization-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-upstream:
    outputs:
      game_version: ${{ steps.inspect.outputs.game_version }}
      source_sha1: ${{ steps.inspect.outputs.source_sha1 }}
      has_changes: ${{ steps.inspect.outputs.has_changes }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Validate automation modules
        run: python -m unittest discover -s automation/tests -p 'test_*.py' -v
      - name: Inspect Ankama localization without writing project state
        id: inspect
        run: |
          python -m automation.update_wakfu_localization --dry-run | tee "$RUNNER_TEMP/wakfu-diff.json"
          python - "$RUNNER_TEMP/wakfu-diff.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          report = json.loads(open(sys.argv[1], encoding="utf-8").read())
          changed = report.get("diff", {})
          has_changes = any(changed.get(kind) for kind in ("NEW", "MODIFIED", "REMOVED"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              print(f"game_version={report['game_version']}", file=output)
              print(f"source_sha1={report['source_sha1']}", file=output)
              print(f"has_changes={'true' if has_changes else 'false'}", file=output)
          if not has_changes:
              print("NO_CHANGES")
          else:
              print("DIFF_ONLY")

  # Production PR inspection is intentionally separate from the disposable
  # fixture writer.  It has no contents:write permission and therefore cannot
  # create a branch or PR.  A future production candidate writer must consume
  # this decision immediately before its write step as well.
  inspect-open-production-prs:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.test_fixture == false)) && needs.inspect-upstream.result == 'success'
    needs: inspect-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Read open PRs and apply duplicate/outdated decision
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ needs.inspect-upstream.outputs.game_version }}
          SOURCE_SHA1: ${{ needs.inspect-upstream.outputs.source_sha1 }}
          REPOSITORY: ${{ github.repository }}
          HAS_CHANGES: ${{ needs.inspect-upstream.outputs.has_changes }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" > "$RUNNER_TEMP/open-prs.json"
          if [ "$HAS_CHANGES" = "true" ]; then
            python -m automation.pr_guard \
              --prs-json "$RUNNER_TEMP/open-prs.json" \
              --game-version "$GAME_VERSION" \
              --source-sha1 "$SOURCE_SHA1" \
              --repository "$REPOSITORY" | tee "$RUNNER_TEMP/pr-decision.json"
          else
            python -m automation.pr_guard \
              --prs-json "$RUNNER_TEMP/open-prs.json" \
              --game-version "$GAME_VERSION" \
              --source-sha1 "$SOURCE_SHA1" \
              --repository "$REPOSITORY" \
              --no-changes | tee "$RUNNER_TEMP/pr-decision.json"
          fi
          echo "No branch, commit, PR, state, baseline, or Release is written by this inspection job."

  mark-outdated-production-prs:
    # A comment is the only write performed before a new candidate is built.
    # We intentionally leave the old branch/PR open so human translations can
    # still be inspected; merge and Release gates reject its stale metadata.
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.test_fixture == false)) && needs.inspect-open-production-prs.result == 'success'
    needs: [inspect-open-production-prs, inspect-upstream]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Mark stale production candidates without closing or merging them
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_VERSION: ${{ needs.inspect-upstream.outputs.game_version }}
          SOURCE_SHA1: ${{ needs.inspect-upstream.outputs.source_sha1 }}
          REPOSITORY: ${{ github.repository }}
          HAS_CHANGES: ${{ needs.inspect-upstream.outputs.has_changes }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" > "$RUNNER_TEMP/open-prs.json"
          args=(--prs-json "$RUNNER_TEMP/open-prs.json" --game-version "$GAME_VERSION" --source-sha1 "$SOURCE_SHA1" --repository "$REPOSITORY")
          if [ "$HAS_CHANGES" != "true" ]; then args+=(--no-changes); fi
          python -m automation.pr_guard "${args[@]}" > "$RUNNER_TEMP/pr-decision.json"
          python - "$RUNNER_TEMP/pr-decision.json" "$REPOSITORY" <<'PY'
          import json
          import subprocess
          import sys

          decision = json.loads(open(sys.argv[1], encoding="utf-8").read())
          repository = sys.argv[2]
          for item in decision.get("outdated_comments", []):
              number = str(item["number"])
              body = item["body"]
              raw = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{repository}/issues/{number}/comments"],
                  text=True,
              )
              try:
                  comments = json.loads(raw)
              except json.JSONDecodeError:
                  comments = []
              if comments and isinstance(comments[0], list):
                  comments = [entry for page in comments for entry in page]
              if any(isinstance(comment, dict) and comment.get("body") == body for comment in comments):
                  print(f"PR_{number}_ALREADY_MARKED")
                  continue
              subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repository}/issues/{number}/comments", "-f", f"body={body}"],
                  check=True,
              )
              print(f"PR_{number}_MARKED_OUTDATED")
          print("No outdated production PRs require a comment." if not decision.get("outdated_comments") else "OUTDATED_PR_MARKING_COMPLETE")
          PY

  # This is an explicitly opt-in, fixture-only write path.  It never consumes
  # production diff output and it can only commit the disposable fixture
  # directory below.  The future production path must keep the same guard:
  # empty NEW/MODIFIED/REMOVED means NO_CHANGES and no branch/commit/PR.
  create-production-pr:
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.test_fixture == false)) && needs.inspect-open-production-prs.result == 'success' && needs.inspect-upstream.outputs.has_changes == 'true'
    needs: [inspect-open-production-prs, inspect-upstream]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_DEVICE_COUNT: '1'
      ARGOS_VENV: argos-venv
      ARGOS_MODEL: translate-en_tr-1_5.argosmodel
      GAME_VERSION: ${{ needs.inspect-upstream.outputs.game_version }}
      SOURCE_SHA1: ${{ needs.inspect-upstream.outputs.source_sha1 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Create isolated translation runtime
        continue-on-error: true
        run: |
          argos_venv="$RUNNER_TEMP/$ARGOS_VENV"
          python -m venv "$argos_venv"
      - name: Install exact translation runtime
        continue-on-error: true
        run: |
          argos_venv="$RUNNER_TEMP/$ARGOS_VENV"
          "$argos_venv/bin/python" -m pip install --disable-pip-version-check -r requirements-translation.txt
      - name: Download and verify locked Argos model from GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          argos_venv="$RUNNER_TEMP/$ARGOS_VENV"
          target="$RUNNER_TEMP/$ARGOS_MODEL"
          release_json="$RUNNER_TEMP/argos-release.json"
          gh release view runtime-argos-1.5 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,assets > "$release_json"
          "$argos_venv/bin/python" - "$release_json" <<'PY'
          import json
          import pathlib
          import sys

          lock = json.loads(pathlib.Path("automation/model-lock.json").read_text(encoding="utf-8"))
          expected_repo = "Relactive55/wakfu-turkiye-yama-calismasi"
          expected_tag = "runtime-argos-1.5"
          expected_asset = "wakfu-translate-en_tr-1_5.argosmodel"
          expected_url = f"https://github.com/{expected_repo}/releases/download/{expected_tag}/{expected_asset}"
          if lock.get("release_tag") != expected_tag or lock.get("asset_name") != expected_asset:
              raise SystemExit("model-lock.json release coordinates are not approved")
          if lock.get("url") != expected_url or lock.get("sha256", "").lower() != "2d553a00880a0c21dea5b1c375535659e6bf18c9bf2ce9847c2a2fd2ff50316a":
              raise SystemExit("model-lock.json is not the approved GitHub-hosted translate-en_tr 1.5 lock")
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("isDraft") or release.get("isPrerelease") or release.get("tagName") != expected_tag:
              raise SystemExit("Argos model Release is not a stable, expected Release")
          if expected_asset not in {item.get("name") for item in release.get("assets", [])}:
              raise SystemExit("Argos model asset is missing from the expected GitHub Release")
          PY
          "$argos_venv/bin/python" -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.unlink(missing_ok=True)' "$target"
          gh release download runtime-argos-1.5 --repo "$GITHUB_REPOSITORY" \
            --pattern 'wakfu-translate-en_tr-1_5.argosmodel' --output "$target" --clobber
          "$argos_venv/bin/python" - "$target" <<'PY'
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path("automation/model-lock.json").read_text(encoding="utf-8"))
          target = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          if target.stat().st_size != int(lock["size_bytes"]) or digest.lower() != lock["sha256"].lower():
              raise SystemExit("ARGOS_MODEL_VERIFICATION_FAILED")
          print(f"ARGOS_MODEL_OK|{target.stat().st_size}|{digest}")
          PY
      - name: Determine Argos availability
        id: argos-status
        if: always()
        run: |
          set -euo pipefail
          argos_venv="$RUNNER_TEMP/$ARGOS_VENV"
          argos_model="$RUNNER_TEMP/$ARGOS_MODEL"
          if [ -x "$argos_venv/bin/python" ] \
            && [ -s "$argos_model" ] \
            && "$argos_venv/bin/python" -c 'import argostranslate' >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ARGOS_READY=true" >> "$GITHUB_ENV"
            echo "ARGOS_READY|true"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ARGOS_READY=false" >> "$GITHUB_ENV"
            echo "ARGOS_READY|false"
          fi
      - name: Build and validate production candidate
        run: |
          set -euo pipefail
          argos_venv="$RUNNER_TEMP/$ARGOS_VENV"
          argos_model="$RUNNER_TEMP/$ARGOS_MODEL"
          python_bin=python
          model_args=()
          if [ "${ARGOS_READY:-false}" = "true" ]; then
            python_bin="$argos_venv/bin/python"
            model_args=(--model-path "$argos_model" --model-lock automation/model-lock.json)
            export XDG_CONFIG_HOME="$RUNNER_TEMP/argos-config"
            export XDG_DATA_HOME="$RUNNER_TEMP/argos-data"
            export XDG_CACHE_HOME="$RUNNER_TEMP/argos-cache"
          fi
          "$python_bin" -m automation.production_pr_update \
            --output-dir "$RUNNER_TEMP/production-pr-output" \
            --allow-provider-unavailable \
            "${model_args[@]}" | tee "$RUNNER_TEMP/production-update.json"
      - name: Commit candidate and open production PR
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/production-pr-output/production_update_report.json"
          test -f "$report"
          status=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$report")
          if [ "$status" = "PROVIDER_UNAVAILABLE" ]; then
            echo "ARGOS_PROVIDER_UNAVAILABLE_NO_STATE_CHANGE"
            exit 0
          fi
          test "$status" = "PRODUCTION_CANDIDATE"
          branch="codex/wakfu-localization-${GAME_VERSION//[^A-Za-z0-9.-]/-}-${SOURCE_SHA1:0:8}"
          if gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length' | grep -qv '^0$'; then
            echo "OPEN_PRODUCTION_PR_ALREADY_EXISTS"
            exit 0
          fi
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ceviri_Verileri/wakfu_tr_ceviri.json automation/state.json automation/snapshots
          git diff --cached --quiet && { echo "NO_CANDIDATE_CHANGES"; exit 0; }
          git commit -m "WAKFU localization update for ${GAME_VERSION}"
          git push --set-upstream origin "$branch"
          python - "$report" "$RUNNER_TEMP/production-pr-body.md" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          diff=report['diff']; counts=report['translation_counts']
          body=f"""## WAKFU localization update

          **Human review required before merge.**

          - Game version: `{report['game_version']}`
          - Source SHA-1: `{report['source_sha1']}`
          - NEW: `{diff['NEW']}`
          - MODIFIED: `{diff['MODIFIED']}`
          - REMOVED (report only): `{diff['REMOVED']}`
          - Translation Memory: `{counts.get('memory', 0)}`
          - Glossary: `{counts.get('glossary-key', 0) + counts.get('glossary-value', 0)}`
          - Argos: `{counts.get('argos', 0)}`
          - Validation: `PASS`

          State and the verified source snapshot are advanced in this candidate branch only; no Release is created until this PR is merged and separately approved."""
          open(sys.argv[2],'w',encoding='utf-8').write(body)
          PY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "WAKFU localization update: ${GAME_VERSION}" \
            --body-file "$RUNNER_TEMP/production-pr-body.md"
      - name: Record provider-unavailable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/production-pr-output/production_update_report.json"
          if [ ! -f "$report" ]; then
            echo "No provider status report was produced."
            exit 0
          fi
          python - "$report" <<'PY'
          import json
          import os
          import subprocess
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if report.get("status") != "PROVIDER_UNAVAILABLE":
              print("ARGOS_PROVIDER_AVAILABLE_OR_UNEXPECTED_FAILURE")
              raise SystemExit(0)

          repository = os.environ["GITHUB_REPOSITORY"]
          title = "[ACTION REQUIRED] WAKFU translation provider unavailable"
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repository}/issues?state=open&per_page=100"],
              text=True,
          )
          issues = json.loads(raw)
          if any(isinstance(item, dict) and item.get("title") == title for item in issues):
              print("ARGOS_PROVIDER_WAITING_ISSUE_ALREADY_OPEN")
              raise SystemExit(0)

          diff = report.get("diff", {})
          body = """## Otomatik çeviri sağlayıcısı beklemede

          Argos çalışma ortamı veya hash-kilitli model doğrulanamadığı için bu çalışmada çeviri belleği, proje durumu, dal, PR veya Release yazılmadı.

          Onaylı çeviri belleği ve sözlük korunuyor. Yeni veya değişen satırlar güvenilir yerel GPU aracıyla ya da manuel incelemeyle onaylandıktan sonra sonraki otomatik döngüye alınacaktır.

          - Oyun sürümü: `{version}`
          - Yeni: `{new}`
          - Değişen: `{modified}`
          - Kaldırılan (yalnızca rapor): `{removed}`
          - Çözülemeyen: `{unresolved}`
          - Neden kodu: `{reason}`
          """.format(
              version=report.get("game_version", "unknown"),
              new=diff.get("NEW", 0),
              modified=diff.get("MODIFIED", 0),
              removed=diff.get("REMOVED", 0),
              unresolved=report.get("unresolved_count", 0),
              reason=report.get("reason_code", "ARGOS_UNAVAILABLE"),
          )
          subprocess.run(
              ["gh", "issue", "create", "--repo", repository, "--title", title, "--body", body],
              check=True,
          )
          print("ARGOS_PROVIDER_WAITING_ISSUE_CREATED")
          PY

  create-test-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.test_fixture == true && needs.inspect-upstream.result == 'success'
    needs: inspect-upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TEST_BRANCH: codex/test-wakfu-update-pipeline-20260905
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_DEVICE_COUNT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Create isolated translation runtime
        run: python -m venv "$RUNNER_TEMP/argos-venv"
      - name: Install exact translation runtime
        run: "$RUNNER_TEMP/argos-venv/bin/python -m pip install --disable-pip-version-check -r requirements-translation.txt"
      - name: Download and verify the locked Argos model from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/translate-en_tr-1_5.argosmodel"
          release_json="$RUNNER_TEMP/argos-release.json"
          gh release view runtime-argos-1.5 --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,assets > "$release_json"
          "$RUNNER_TEMP/argos-venv/bin/python" - "$release_json" <<'PY'
          import json
          import pathlib
          import sys

          lock = json.loads(pathlib.Path("automation/model-lock.json").read_text(encoding="utf-8"))
          expected_repo = "Relactive55/wakfu-turkiye-yama-calismasi"
          expected_tag = "runtime-argos-1.5"
          expected_asset = "wakfu-translate-en_tr-1_5.argosmodel"
          expected_url = f"https://github.com/{expected_repo}/releases/download/{expected_tag}/{expected_asset}"
          if lock.get("release_tag") != expected_tag or lock.get("asset_name") != expected_asset:
              raise SystemExit("model-lock.json release coordinates are not approved")
          if lock.get("url") != expected_url or lock.get("sha256", "").lower() != "2d553a00880a0c21dea5b1c375535659e6bf18c9bf2ce9847c2a2fd2ff50316a":
              raise SystemExit("model-lock.json is not the approved GitHub-hosted translate-en_tr 1.5 lock")
          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if release.get("isDraft") or release.get("isPrerelease") or release.get("tagName") != expected_tag:
              raise SystemExit("Argos model Release is not a stable, expected Release")
          if expected_asset not in {item.get("name") for item in release.get("assets", [])}:
              raise SystemExit("Argos model asset is missing from the expected GitHub Release")
          PY
          "$RUNNER_TEMP/argos-venv/bin/python" -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.unlink(missing_ok=True)' "$target"
          gh release download runtime-argos-1.5 --repo "$GITHUB_REPOSITORY" \
            --pattern 'wakfu-translate-en_tr-1_5.argosmodel' --output "$target" --clobber
          "$RUNNER_TEMP/argos-venv/bin/python" - "$target" <<'PY'
          import hashlib, json, pathlib, sys
          lock = json.loads(pathlib.Path("automation/model-lock.json").read_text(encoding="utf-8"))
          target = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          if target.stat().st_size != int(lock["size_bytes"]) or digest.lower() != lock["sha256"].lower():
              raise SystemExit("ARGOS_MODEL_VERIFICATION_FAILED")
          print(f"ARGOS_MODEL_OK|{target.stat().st_size}|{digest}")
          PY
      - name: Run simulated update without touching production state
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/argos-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/argos-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/argos-cache"
          "$RUNNER_TEMP/argos-venv/bin/python" -m automation.simulated_pr_update \
            --output-dir "$RUNNER_TEMP/pr_pipeline_output" \
            --model-path "$RUNNER_TEMP/translate-en_tr-1_5.argosmodel" \
            --model-lock automation/model-lock.json
      - name: Commit only the test fixture
        id: commit
        run: |
          if git ls-remote --exit-code --heads origin "$TEST_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$TEST_BRANCH"
            git switch --track --create "$TEST_BRANCH" "origin/$TEST_BRANCH"
          else
            git switch --create "$TEST_BRANCH"
          fi
          rm -rf automation/fixtures/pr_pipeline
          cp -R "$RUNNER_TEMP/pr_pipeline_output" automation/fixtures/pr_pipeline
          git add automation/fixtures/pr_pipeline
          if git diff --cached --quiet; then
            echo "TEST_FIXTURE_ALREADY_ON_BRANCH"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Test simulated WAKFU translation PR pipeline"
            git push --set-upstream origin "$TEST_BRANCH"
          fi
          changed_files=$(git diff --name-only main...HEAD)
          forbidden_files=$(printf '%s\n' "$changed_files" | grep -Ev '^automation/fixtures/pr_pipeline/' || true)
          if [ -n "$forbidden_files" ]; then
            echo "TEST_PR_SCOPE_VIOLATION"
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
          if [ -z "$changed_files" ]; then
            echo "TEST_FIXTURE_PRODUCED_NO_CHANGES"
            exit 1
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed_files" > "$RUNNER_TEMP/test-pr-changed-files.txt"
      - name: Create TEST ONLY pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/argos-venv/bin/python" - "automation/fixtures/pr_pipeline/simulated_update_report.json" "$RUNNER_TEMP/test-pr-body.md" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          diff = report["diff"]
          counts = report["translation_counts"]
          run_url = f"https://github.com/{sys.argv[3]}/actions/runs/{sys.argv[4]}"
          body = f"""## TEST PIPELINE ONLY

          **DO NOT MERGE** — this PR is a disposable simulated update used to verify the write/PR path.

          - Simulated game version: `{report['simulated_game_version']}`
          - Simulated patch version: `{report['simulated_patch_version']}`
          - NEW: `{diff['NEW']}`
          - MODIFIED: `{diff['MODIFIED']}`
          - REMOVED: `{diff['REMOVED']}`
          - UNCHANGED: `{diff['UNCHANGED']}`
          - Translation Memory: `{counts['tm']}`
          - Glossary: `{counts['glossary']}`
          - Argos: `{counts['argos']}`
          - Manual duplicate-key resolutions: `{counts['manual']}`
          - Placeholder/tag validation: `{report['placeholder_and_tag_validation']}`
          - Full validation: `{report['validation']}`
          - JAR build: `{report['build']['status']}` (temporary asset, not a Release)
          - Production state/translation files changed: `no`
          - Workflow run: {run_url}

          This PR must remain unmerged. No Release is created by this workflow.
          """
          Path(sys.argv[2]).write_text(body, encoding="utf-8")
          PY
          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$TEST_BRANCH" \
            --title "[TEST] Simulated WAKFU translation update pipeline" \
            --body-file "$RUNNER_TEMP/test-pr-body.md")
          auto_merge_disabled=$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest == null')
          if [ "$auto_merge_disabled" != "true" ]; then
            echo "AUTO_MERGE_MUST_REMAIN_DISABLED"
            exit 1
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### TEST PIPELINE ONLY"
            echo "- Branch: `$TEST_BRANCH`"
            echo "- Commit: `${{ steps.commit.outputs.commit_sha }}`"
            echo "- PR: $pr_url"
            echo "- Auto-merge: disabled"
            echo "- Changed files:"
            sed 's/^/  - /' "$RUNNER_TEMP/test-pr-changed-files.txt"
          } >> "$GITHUB_STEP_SUMMARY"
