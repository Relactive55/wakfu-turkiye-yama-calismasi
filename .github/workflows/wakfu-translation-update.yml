name: WAKFU localization update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only inspect the Ankama source; do not create a branch or PR
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: wakfu-localization-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Validate automation modules
        run: python -m unittest discover -s automation/tests -p 'test_*.py' -v
      - name: Inspect Ankama localization without writing project state
        run: python -m automation.update_wakfu_localization --dry-run

# A future write-enabled PR job must be a separate workflow or environment-gated
# job.  It may run only after this read-only inspection, validation and human
# review; it must never create a Release.
